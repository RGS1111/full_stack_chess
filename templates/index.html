<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Landing Page</title>
  <link rel="stylesheet" href="styles.css" type="text/css">
</head>
<body>
  <header class="hero">
    <div class="inside-hero">
      <img src="../assets/chess-knight.svg" alt="Company Logo" class="logo-img">
      <span class="hero-h1">Chess Game</span>
    </div>
  </header>
  <main>
    <section class="panel">
      <article>
        <h2 class="panel-text">Start a New Game</h2>
        <p class="panel-text">Create a new game, then share code with your friend to start.</p>
        <p class="panel-text">SHAREABLE GAME CODE</p>
        <button class="gen_code_btn" type="button">Generate Game Code</button>
      </article>
      <article>
        <h2 class="panel-text">Enter a Game</h2>
        <p class="panel-text">Join a game, using code given.</p>
        <p class="panel-text">ENTER CODE BELOW</p>
      </article>
    </section>
    <section class="testimonials"></section>
    <section class="pricing"></section>
    <section class="faq"></section>
  </main>
  <footer class="site-footer"></footer>
</body>
</html>
